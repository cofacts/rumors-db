name: CI test

on:
  # Triggers the workflow on push or pull request events
  - pull_request
  - push
  # Allows you to run this workflow manually from the Actions tab
  - workflow_dispatch

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # `npm run schema` creates <index>_v<VERSION>, so a mapping change needs a
      # VERSION bump to get a new index. Compare against the PR's base branch.
      - name: Check VERSION is bumped when a mapping changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          mkdir -p .base
          git archive FETCH_HEAD schema util | tar -x -C .base
          npm run check-version-bump -- .base/schema
        env:
          BASE_REF: ${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    services:
      rumors-test-db:
        image: elasticsearch:9.3.2
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
        ports:
          - 62223:9200
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Test if schema loads
        run: npm run test
        env:
          ELASTICSEARCH_URL: http://localhost:62223
      - name: Test if examples load
        run: npm run seed
        env:
          ELASTICSEARCH_URL: http://localhost:62223
      - name: Test if examples match zod schema
        run: npm run scan
        env:
          ELASTICSEARCH_URL: http://localhost:62223

